<title>Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: top bar + tabs, one working surface (library / reader / mind map), Buddy docked right on wide screens, full sheet on phones */
:root{--bg:#F3F4F8;--surface:#fff;--surface2:#E9ECF3;--ink:#171F2E;--muted:#5A6479;--line:#D6DBE6;--accent:#3446D6;--accent-ink:#fff;--accent-soft:#E2E6FB;--hi:#FFE46B;--hi-ink:#4A3D00;--good:#16794C;--bad:#B42318;--grid:#D9DDE8;--nstroke:#8D99B8;
--c1:#DCE4FF;--c2:#D3EFE2;--c3:#FFE8BF;--c4:#F9D8E0;--c5:#E5DAF6;--c6:#E7EAF0;
--ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--disp:"Space Grotesk",Inter,system-ui,sans-serif;--read:Literata,Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F131B;--surface:#171C27;--surface2:#212837;--ink:#E7EAF2;--muted:#9AA4B9;--line:#2B3446;--accent:#93A1FF;--accent-ink:#0F131B;--accent-soft:#252D52;--hi:#6B5A12;--hi-ink:#FFF0A8;--good:#5FD39B;--bad:#FF8A7D;--grid:#222A3A;--nstroke:#58648A;--c1:#2A3563;--c2:#1F4A3A;--c3:#5A4420;--c4:#5B2A38;--c5:#403060;--c6:#333B4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F131B;--surface:#171C27;--surface2:#212837;--ink:#E7EAF2;--muted:#9AA4B9;--line:#2B3446;--accent:#93A1FF;--accent-ink:#0F131B;--accent-soft:#252D52;--hi:#6B5A12;--hi-ink:#FFF0A8;--good:#5FD39B;--bad:#FF8A7D;--grid:#222A3A;--nstroke:#58648A;--c1:#2A3563;--c2:#1F4A3A;--c3:#5A4420;--c4:#5B2A38;--c5:#403060;--c6:#333B4A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
#top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 0 8px}
.brand{display:flex;align-items:center;gap:8px;font:700 17px var(--disp);letter-spacing:-.01em;margin-right:auto}
.brand i{width:20px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
#tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px;order:3;width:100%}
#tabs button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;display:flex;gap:6px;align-items:center;justify-content:center;color:var(--muted);font-weight:500}
#tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media(min-width:760px){#tabs{order:0;width:auto;min-width:340px}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
#body{flex:1;min-height:0;display:flex;gap:12px;padding-bottom:10px}
#main{flex:1;min-width:0;min-height:0;overflow:auto;border-radius:14px}
h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
/* library */
.lib{display:flex;flex-direction:column;gap:22px;padding-bottom:20px}
.drop{border:1.5px dashed var(--nstroke);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .t{flex:1;min-width:200px}
.drop .t b{display:block;font:600 16px var(--disp)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .nm{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.badge{background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge.ex{background:var(--hi);color:var(--hi-ink)}
.card .row{display:flex;gap:6px;margin-top:auto}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
/* reader */
.reader{display:flex;flex-direction:column;height:100%;min-height:0}
.rbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.rbar input.ttl{flex:1;min-width:140px;border:1px solid transparent;background:none;font:700 18px var(--disp);padding:4px 6px;border-radius:8px}
.rbar input.ttl:hover,.rbar input.ttl:focus{border-color:var(--line);background:var(--surface)}
.pw{flex:1;min-height:0;overflow:auto}
.paper{max-width:740px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,5vw,44px);font:17px/1.75 var(--read);overflow-wrap:anywhere}
.paper[contenteditable=true]{outline:2px solid var(--accent)}
.paper h1,.paper h2,.paper h3{font-family:var(--disp);line-height:1.25;margin:1.3em 0 .4em}
.paper h1{font-size:1.6em}.paper h2{font-size:1.3em}.paper h3{font-size:1.1em}
.paper>:first-child{margin-top:0}
.paper p{margin:.7em 0}
.paper table{border-collapse:collapse;margin:1em 0;font:15px/1.5 var(--ui);display:block;overflow-x:auto;max-width:100%}
.paper td,.paper th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.paper th{background:var(--surface2)}
.paper blockquote{margin:1em 0;padding-left:14px;border-left:3px solid var(--nstroke);color:var(--muted)}
.paper pre{background:var(--surface2);padding:12px;border-radius:8px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace}
.paper .li{display:flex;gap:8px;margin:.25em 0;padding-left:calc(var(--d,0)*1.5em)}
.paper .li .n{flex:none;min-width:1.4em;color:var(--muted)}
.paper .margin{font:14px var(--ui);background:var(--surface2);border-radius:8px;padding:6px 10px;margin:.7em 0;color:var(--muted)}
.paper .margin::before{content:"Margin note · ";font-weight:600}
.paper .fig{font:14px var(--ui);border:1px dashed var(--nstroke);border-radius:8px;padding:8px 10px;margin:.8em 0;color:var(--muted)}
.paper .math{font:15px ui-monospace,Menlo,monospace;text-align:center;margin:.8em 0}
.paper img{max-width:100%;border-radius:8px}
.pbreak{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--line);margin:2em 0 1em;padding-top:6px;user-select:none}
mark.unsure{background:var(--hi);color:var(--hi-ink);border-radius:3px;padding:0 2px}
.empty{display:grid;place-items:center;text-align:center;padding:40px 16px;color:var(--muted);gap:10px}
#selbar{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px);display:flex;gap:2px;background:var(--ink);color:var(--bg);padding:5px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#selbar button{padding:10px 14px!important}
#selbar button{background:none;border:0;color:inherit;padding:6px 10px;border-radius:7px;font-weight:500;white-space:nowrap}
#selbar button:hover{background:rgba(127,127,127,.3)}
/* scan */
.scan{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.th{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px}
.th img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px}
.th .row{display:flex;gap:4px;justify-content:space-between;align-items:center;font-size:12px}
.opts{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.opts select,.opts input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.st-ok{color:var(--good)}.st-bad{color:var(--bad)}
/* map */
.mapview{display:flex;flex-direction:column;height:100%;min-height:0;gap:8px}
.tools{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:11px;min-width:58px;color:var(--muted)}
.tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctx{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:34px;font-size:13px}
.ctx .lbl{color:var(--muted)}
.sep{width:1px;height:18px;background:var(--line)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--nstroke)}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip.danger{color:var(--bad)}
#mapwrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
#ed{position:absolute;z-index:5;border:2px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center;resize:none;padding:8px;font:14px/20px var(--ui);outline:none}
.node text{fill:var(--ink);font:500 14px var(--ui);pointer-events:none}
.node .sh{stroke:var(--nstroke);stroke-width:1.5}
.node.sel .sh{stroke:var(--accent);stroke-width:3}
.node.pend .sh{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:3}
/* buddy */
#buddy{position:fixed;inset:0;z-index:30;background:var(--surface);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));min-height:0}
@media(min-width:1000px){#buddy{position:static;width:390px;flex:none;border:1px solid var(--line);border-radius:14px;padding:0 14px}}
.bh{display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.bh .bt{font:700 16px var(--disp);display:flex;gap:7px;align-items:center;margin-right:auto}
.pill{font:500 12px var(--ui);background:var(--accent-soft);padding:2px 9px;border-radius:999px;color:var(--ink)}
.ib{border:0;background:none;padding:6px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--surface2);color:var(--ink)}
#chat{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msg{max-width:94%;padding:9px 12px;border-radius:12px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--surface2);width:94%}
.msg .sc{font-size:11px;opacity:.75;margin-bottom:2px}
.msg p{margin:.4em 0}.msg p:first-child{margin-top:0}.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:.4em 0;padding-left:1.3em}
.msg .tools2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:10px}
#ctxchip{display:flex;gap:6px;align-items:center;font-size:12px;background:var(--surface2);border-radius:9px;padding:5px 6px 5px 10px;margin-bottom:6px}
#ctxchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#quick{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
#bform{display:flex;gap:6px;align-items:flex-end;padding:4px 0 12px}
#bin{flex:1;resize:none;max-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.bset{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.mode{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode b{display:block}.mode span{color:var(--muted);font-size:13px}
.bset textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;resize:vertical}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;margin:4px 0}
.qopt.good{border-color:var(--good);background:var(--accent-soft)}.qopt.bad{border-color:var(--bad)}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;margin:6px 0;width:100%;text-align:left}
#lb{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#lb img,#lb canvas{max-width:100%;max-height:78%;object-fit:contain;background:#fff;border-radius:6px}
#lb .row{display:flex;gap:8px;align-items:center;color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;max-width:90%}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes selin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes slidein{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sheetup{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{opacity:.2}40%{opacity:1}}
#main.enter>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
#main.enter>.lib{animation:none}
#main.enter .lib>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#main.enter .lib>*:nth-child(2){animation-delay:.07s}
#main.enter .lib>*:nth-child(3){animation-delay:.14s}
#main.enter .lib>*:nth-child(4){animation-delay:.21s}
#main.enter .grid .card{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 90ms)}
.card{transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,30,60,.12);border-color:var(--accent)}
.btn,.chip,.tool,.ib,#selbar button{transition:background .15s,border-color .15s,transform .1s,color .15s}
.btn:active,.chip:active,.tool:active,.ib:active,#selbar button:active{transform:scale(.95)}
#tabs button{transition:background .2s,color .2s,box-shadow .2s}
#selbar:not([hidden]){animation:selin .18s ease-out both}
.msg.enter{animation:pop .25s ease-out both}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:3px;animation:dots 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
#buddy:not([hidden]){animation:slidein .28s cubic-bezier(.2,.7,.2,1) both}
@media(max-width:999px){#buddy:not([hidden]){animation:sheetup .28s cubic-bezier(.2,.7,.2,1) both}}
/* reader extras */
.paper{font-size:var(--rs,17px)}
.prog{height:3px;background:var(--surface2);border-radius:3px;margin-bottom:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.fsz{display:inline-flex}.fsz .ib{font-weight:700;font-size:13px;padding:4px 8px}
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.hero h2{font-size:24px}
.chip.primary2{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* layout menu */
#laymenu{position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:min(310px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.25);animation:pop .18s both;transform-origin:top right}
.lopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.lopt:last-child{margin-bottom:0}
.lopt.on{border-color:var(--accent);background:var(--accent-soft)}
.lopt svg{flex:none;color:var(--accent)}
.lopt span{font-size:13px;color:var(--muted)}.lopt span b{display:block;color:var(--ink);font-size:14px}
@media(max-width:520px){#layBtn .lt{display:none}}
/* layout: sidebar */
#rail{display:none}
.ritem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:9px;color:var(--ink);min-width:0}
.ritem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ritem:hover{background:var(--surface2)}.ritem.on{background:var(--accent-soft);font-weight:600}
.rsec{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 9px 4px}
@media(min-width:900px){
 #app[data-layout=sidebar] #rail{display:flex;flex-direction:column;width:236px;flex:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;animation:slidein .3s both}
 #app[data-layout=sidebar] #tabs{display:none}}
@media(max-width:899px){
 #app[data-layout=sidebar]{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
 #app[data-layout=sidebar] #tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;width:auto;min-width:0;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));gap:6px}
 #app[data-layout=sidebar] #tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
 #app[data-layout=sidebar]~#selbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
/* layout: split study */
#app[data-layout=split] #buddyBtn,#app[data-layout=split] [data-act=bclose]{display:none}
#app[data-layout=split] #buddy{position:static;border:1px solid var(--line);border-radius:14px;padding:0 14px}
@media(min-width:760px){#app[data-layout=split] #buddy{width:380px;flex:none}#app[data-layout=split]~#selbar{left:calc(50% - 190px)}}
@media(max-width:759px){#app[data-layout=split] #body{flex-direction:column}#app[data-layout=split] #buddy{flex:0 0 42vh;width:auto;min-height:0}#app[data-layout=split]~#selbar{bottom:calc(42vh + 14px)}}

function layoutTree(data){const nodes=[{id:'root',text:String(data.root||data.title||'Topic')}];const kids={root:[]};const seen=new Set(['root']);
 for(const n of(data.nodes||[])){const id=String(n.id);if(seen.has(id))continue;seen.add(id);nodes.push({id,text:String(n.text||'')});kids[id]=[]}
 const par={};for(const n of(data.nodes||[]))par[String(n.id)]=String(n.parent??'root');
 const reach=new Set(['root']),tree={};for(const k in kids)tree[k]=[];
 let prog=true;const rem=nodes.slice(1);while(prog){prog=false;for(const n of rem){if(reach.has(n.id))continue;const p=par[n.id];if(reach.has(p)&&p!==n.id){tree[p].push(n.id);reach.add(n.id);prog=true}}}
 for(const n of rem)if(!reach.has(n.id)){tree.root.push(n.id);reach.add(n.id)}
 const lc={};const leaves=id=>lc[id]||(lc[id]=tree[id].length?tree[id].reduce((s,c)=>s+leaves(c),0):1);const total=leaves('root'),pos={},col={};
 const place=(id,a0,a1,dep,c)=>{pos[id]={dep,a:(a0+a1)/2,c};let a=a0;for(const ch of tree[id]){const span=(a1-a0)*leaves(ch)/leaves(id);place(ch,a,a+span,dep+1,c);a+=span}};
 let a=-Math.PI/2;tree.root.forEach((ch,i)=>{const span=2*Math.PI*leaves(ch)/total;place(ch,a,a+span,1,1+i%5);a+=span});
 const base=Math.max(210,total*14);const out={nodes:[],edges:[]};
 for(const n of nodes){const p=pos[n.id],r=p?(p.dep===1?base:base+(p.dep-1)*190):0;out.nodes.push({id:n.id,text:n.text,x:p?Math.cos(p.a)*r:0,y:p?Math.sin(p.a)*r:0,c:p?p.c:5,shape:'ellipse',root:!p})}
 for(const k in tree)for(const c of tree[k])out.edges.push([k,c]);return out}

function lessonChunks(d){const us=unitsOf(parseDoc(d));let cs=[],cur=null;const push=()=>{if(cur&&cur.text.trim())cs.push(cur);cur=null};

"""
${ck.text.slice(0,2600)}
"""

async function ensureCard(d,i){const ls=d.lesson;if(!ls||!ls.ch[i])return;const c=ls.ch[i],key=d.id+':'+i;if(c.card||L.load.has(key))return;

 const head=`<div class="rbar"><button class="btn sm" data-act="nav" data-v="library">${ic('back',15)}Library</button><h3 style="flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d?esc(d.title):'Learn'}</h3>${seg}</div>`;

function lessonHtml(d){const cs=lessonChunks(d),sg=chunkSig(cs),ls=d.lesson;

function chunkHtml(d,ls,cs){const i=ls.idx,n=ls.ch.length,c=ls.ch[i],key=d.id+':'+i;

  +(c.rev?`<div class="exbox"><b>Model answer</b><br>${inline(k.model||'')}</div><p class="muted">How close was yours?</p><div class="acts">${[['got','Got it'],['part','Partly'],['no','Not yet']].map(([v,l])=>`<button class="chip${c.rate===v?' on':''}" data-act="lrate" data-v="${v}">${l}</button>`).join('')}</div>`:`<div class="acts"><button class="btn primary" data-act="lreveal">Show model answer</button></div>`)

function startReview(d){const ls=d.lesson,pool=[];

 ls.ch.forEach((c,ci)=>{if(!c.card||!cs[ci])return;const st=sState(d.ev&&d.ev[cs[ci].h]).st,w=st==='shaky'||c.rate==='no'?3:c.rate==='part'?2:1;for(const q of c.card.check)pool.push({q:q.q,options:q.options,answer:cidx(q),why:q.why,w,h:cs[ci].h})});
 const items=[];while(items.length<6&&pool.length){const tot=pool.reduce((s,p)=>s+p.w,0);let r=Math.random()*tot,k=0;for(;k<pool.length-1;k++){r-=pool[k].w;if(r<=0)break}items.push(pool.splice(k,1)[0])}
 if(!items.length){ls.phase='done';return}ls.phase='review';ls.rev={items,i:0,ans:[]}}
function doneHtml(d,ls){const ss=secs(d);return`<div class="lcard"><h3>Lesson complete</h3><p>Where you stand now, based on how you answered:</p>${partRows(ss)}<div class="acts"><button class="btn primary" data-act="ltab" data-v="review">See progress</button><button class="btn" data-act="ltab" data-v="recall">Recall without looking</button><button class="btn" data-act="lstart">Restart lesson</button></div></div>`}

const recallPrompt2=(d,t)=>`A learner closed their study material and wrote down everything they remember. Compare it with the material.
Rules: use only the material. Do not add facts. Judge meaning, not exact wording.
MATERIAL:
"""
${(d.text||'').slice(0,60000)}
"""
LEARNER'S RECALL:
"""
${t.slice(0,8000)}
"""
Reply with JSON only: {"covered":[{"point":"important point remembered correctly (short)","from":"exact 8-12 word quote from the material"}],"missed":[{"point":"important point left out (short)","from":"exact 8-12 word quote from the material"}],"wrong":[{"said":"what the learner wrote","correct":"what the material says","from":"exact 8-12 word quote"}]}
At most 12 covered, 12 missed and 6 wrong, only the important points.`;
function recallResult(d,r){const c=r.covered.length,m=r.missed.length,tot=Math.max(1,c+m),pt=x=>inline(String(x&&x.point||x||''));
 return`<div class="lcard res"><h3>You remembered ${c} of ${c+m} main points</h3><div class="cov"><i style="width:${Math.round(c/tot*100)}%"></i></div>
 ${c?`<div><b>Remembered</b><ul>${r.covered.map(x=>`<li>${pt(x)}</li>`).join('')}</ul></div>`:''}
 ${m?`<div><b>Left out</b><ul>${r.missed.map(x=>`<li>${pt(x)}${x.from?`<div class="src">From your file: “${esc(String(x.from))}”</div>`:''}</li>`).join('')}</ul></div>`:''}
 ${r.wrong.length?`<div><b>Check these</b><ul>${r.wrong.map(x=>`<li>You wrote: ${inline(String(x.said||''))}<br>Your file says: ${inline(String(x.correct||''))}</li>`).join('')}</ul></div>`:''}
 <p class="muted" style="font-size:13px">This also updates your progress for each part it touched.</p>
 <div class="acts"><button class="btn primary" data-act="rclear">Try again from memory</button><button class="btn" data-act="ltab" data-v="review">See progress</button><button class="btn" data-act="gotoreader">Open the file</button></div></div>`}
async function checkRecall(d){const t=(L.rtext[d.id]||'').trim();if(t.length<15)return toast('Write a little more first.');

 try{const j=await askJSON(recallPrompt2(d,t),j=>j&&Array.isArray(j.covered)&&Array.isArray(j.missed));
  const res={id:d.id,covered:arr(j.covered),missed:arr(j.missed),wrong:arr(j.wrong)};L.recall=res;d.recall={ts:Date.now(),c:res.covered.length,m:res.missed.length};
  applyCoverage(d,res.covered,[...res.missed,...res.wrong]);await saveDoc(d)}

function reviewHtml(d){const ss=secs(d),att=attention(d).slice(0,3),cal=calibration(d),tested=ss.filter(s=>s.st!=='none').length,solid=ss.filter(s=>s.st==='solid').length;

 <p>${tested?`<b>${solid} of ${ss.length}</b> parts solid · ${tested} tested`:'Nothing tested yet. Start a lesson, or test yourself on any part.'}</p>
 <p class="muted" style="font-size:13px">This is based on how you answered, explained and recalled, not on what you opened or marked done. Recent answers count more.</p></div>`;
 if(att.length)h+=`<div class="lcard"><h3>Deserves attention next</h3>${att.map(a=>`<div class="arow"><div><b>Part ${a.i+1}: ${esc(a.title)}</b><div class="muted" style="font-size:13px">${esc(a.why)}</div></div><div class="acts"><button class="btn sm primary" data-act="testpart" data-i="${a.i}">Test myself</button><button class="btn sm" data-act="readpart" data-i="${a.i}">Read it</button></div></div>`).join('')}</div>`;
 const bits=[];if(cal.s.n>=3)bits.push(`When you felt <b>sure</b>, you were right ${cal.s.ok} of ${cal.s.n} times.`);if(cal.g.n>=3)bits.push(`When you <b>guessed</b>, you were right ${cal.g.ok} of ${cal.g.n} times.`);
 if(bits.length)h+=`<div class="lcard"><h3>How well you know what you know</h3><p>${bits.join(' ')}</p><p class="muted" style="font-size:13px">${cal.s.n>=3&&cal.s.ok/cal.s.n<.6?'Feeling sure has not been a reliable sign yet, so check yourself before trusting it.':'Compare how sure you felt with how you did. That gap is what to keep an eye on.'}</p></div>`;
 return h+`<div class="lcard"><h3>All parts</h3>${partRows(ss)}</div>`}
/* ---------- mind map: tidy, draw.io-style ---------- */
function dims(n){const lines=wrapText(n.text,n.shape==='ellipse'?18:22),len=Math.max(4,...lines.map(l=>l.length));return{lines,w:Math.max(96,Math.round((len*8+36)/GRID)*GRID),h:Math.max(48,Math.round((lines.length*20+24)/GRID)*GRID)}}
function snapNode(n){const d=dims(n);n.x=Math.round((n.x-d.w/2)/GRID)*GRID+d.w/2;n.y=Math.round((n.y-d.h/2)/GRID)*GRID+d.h/2}
function addNode(x,y,text='',shape='rect',c=1){const n={id:uid(),x,y,text,shape,c};snapNode(n);M.map.nodes.push(n);return n}
function rpath(pts,r=10){let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const p=pts[i-1],c=pts[i],n=pts[i+1],l1=Math.hypot(c[0]-p[0],c[1]-p[1])||1,l2=Math.hypot(n[0]-c[0],n[1]-c[1])||1,rr=Math.min(r,l1/2,l2/2);
  d+=`L${c[0]-(c[0]-p[0])/l1*rr} ${c[1]-(c[1]-p[1])/l1*rr}Q${c[0]} ${c[1]} ${c[0]+(n[0]-c[0])/l2*rr} ${c[1]+(n[1]-c[1])/l2*rr}`}
 const e=pts[pts.length-1];return d+`L${e[0]} ${e[1]}`}
function edgePts(a,b){const da=dims(a),db=dims(b),ex=n=>n.shape==='ellipse'?1.12:1,ha=da.w/2*ex(a),hb=db.w/2*ex(b),dx=b.x-a.x,dy=b.y-a.y;
 if(Math.abs(dx)>=ha+hb+24){const s=dx>0?1:-1,sx=a.x+s*ha,tx=b.x-s*hb,mx=Math.round((sx+tx)/2);return Math.abs(dy)<1?[[sx,a.y],[tx,b.y]]:[[sx,a.y],[mx,a.y],[mx,b.y],[tx,b.y]]}
 const va=da.h/2*ex(a),vb=db.h/2*ex(b),s=dy>=0?1:-1,sy=a.y+s*va,ty=b.y-s*vb,my=Math.round((sy+ty)/2);return Math.abs(dx)<1?[[a.x,sy],[b.x,ty]]:[[a.x,sy],[a.x,my],[b.x,my],[b.x,ty]]}
function tidyMap(m){const by=Object.fromEntries(m.nodes.map(n=>[n.id,n])),kids={},inc=new Set();m.nodes.forEach(n=>kids[n.id]=[]);
 for(const e of m.edges)if(by[e.a]&&by[e.b]&&e.a!==e.b&&!inc.has(e.b)){kids[e.a].push(e.b);inc.add(e.b)}
 for(const k in kids)kids[k].sort((x,y)=>by[x].y-by[y].y);
 const GX=64,GY=24,seen=new Set(),kk={},H={},D={},roots=[];
 const measure=(id,dep)=>{seen.add(id);D[id]=dep;kk[id]=[];for(const k of kids[id])if(!seen.has(k)){kk[id].push(k);measure(k,dep+1)}
  const hh=dims(by[id]).h,sum=kk[id].reduce((s,k)=>s+H[k],0)+GY*Math.max(0,kk[id].length-1);H[id]=Math.max(hh,sum)};
 const starts=m.nodes.filter(n=>!inc.has(n.id)).sort((a,b)=>a.y-b.y);
 for(const n of starts)if(!seen.has(n.id)){roots.push(n.id);measure(n.id,0)}
 for(const n of[...m.nodes].sort((a,b)=>a.y-b.y))if(!seen.has(n.id)){roots.push(n.id);measure(n.id,0)}
 const colW=[];m.nodes.forEach(n=>{const d=D[n.id];colW[d]=Math.max(colW[d]||0,dims(n).w)});const colX=[];let x=0;colW.forEach((w,i)=>{colX[i]=x;x+=w+GX});
 let top=0;const place=(id,t)=>{const n=by[id],d=dims(n),ks=kk[id];n.x=colX[D[id]]+d.w/2;
  if(!ks.length){n.y=t+H[id]/2;return}const tot=ks.reduce((s,k)=>s+H[k],0)+GY*(ks.length-1);let y=t+(H[id]-tot)/2;for(const k of ks){place(k,y);y+=H[k]+GY}
  n.y=(by[ks[0]].y+by[ks[ks.length-1]].y)/2};
 for(const r of roots){place(r,top);top+=H[r]+GY*2}
 m.nodes.forEach(snapNode)}
function layoutTree(data){const nodes=[{id:'root',text:String(data.root||data.title||'Topic')}],kids={root:[]},seen=new Set(['root']);
 for(const n of(data.nodes||[])){const id=String(n.id);if(seen.has(id))continue;seen.add(id);nodes.push({id,text:String(n.text||'')});kids[id]=[]}
 const par={};for(const n of(data.nodes||[]))par[String(n.id)]=String(n.parent??'root');
 const reach=new Set(['root']),tree={};for(const k in kids)tree[k]=[];
 let prog=true;const rem=nodes.slice(1);while(prog){prog=false;for(const n of rem){if(reach.has(n.id))continue;const p=par[n.id];if(reach.has(p)&&p!==n.id){tree[p].push(n.id);reach.add(n.id);prog=true}}}
 for(const n of rem)if(!reach.has(n.id)){tree.root.push(n.id);reach.add(n.id)}
 const col={};tree.root.forEach((c,i)=>{const go=(id)=>{col[id]=1+i%5;tree[id].forEach(go)};go(c)});
 const tm={nodes:nodes.map((n,i)=>({id:n.id,text:n.text,x:0,y:i,shape:'rect',c:n.id==='root'?5:col[n.id]||1,root:n.id==='root'})),edges:[]};
 for(const k in tree)for(const c of tree[k])tm.edges.push({id:k+'>'+c,a:k,b:c});
 tidyMap(tm);return{nodes:tm.nodes,edges:tm.edges.map(e=>[e.a,e.b])}}
function mapFromAI(data,intoCurrent){const L2=layoutTree(data),ids={};let ox=0,oy=0,m;
 if(intoCurrent&&M.map){m=M.map;snap();if(m.nodes.length){let mn=1e9,mx=-1e9;for(const n of m.nodes){mn=Math.min(mn,n.x-dims(n).w/2);mx=Math.max(mx,n.y+dims(n).h/2)}ox=mn;oy=mx+96}}
 else{m=newMapObj(String(data.title||data.root||'Mind map').slice(0,60));if(S.docId)m.docId=S.docId}
 for(const n of L2.nodes){const id=uid();ids[n.id]=id;const nn={id,x:n.x+ox,y:n.y+oy,text:n.text,shape:'rect',c:n.c,root:n.root};m.nodes.push(nn);snapNode(nn)}
 for(const[a,b]of L2.edges)m.edges.push({id:uid(),a:ids[a],b:ids[b]});
 if(!intoCurrent){S.maps.push(m);S.mapId=m.id;M.map=m;M.hist=[];M.fut=[];M.sel=null}M.view=null;store.put('maps',m);setView('map')}
function drawMap(){const m=M.map,w=$('#world');if(!w)return;const v=M.view;if(!v)return;w.setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`);
 const pat=$('#gp');if(pat)pat.setAttribute('patternTransform',`translate(${v.x} ${v.y}) scale(${v.k})`);
 const byId=Object.fromEntries(m.nodes.map(n=>[n.id,n]));let h='';
 for(const s of m.strokes)h+=`<path data-k="stroke" data-id="${s.id}" d="${s.pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="${PENC[s.c]||PENC.ink}" stroke-width="${s.w}" stroke-linecap="round" stroke-linejoin="round" opacity="${M.sel&&M.sel.id===s.id?.6:1}"/>`;
 for(const e of m.edges){const a=byId[e.a],b=byId[e.b];if(!a||!b)continue;const on=M.sel&&M.sel.id===e.id,d=rpath(edgePts(a,b));
  h+=`<path d="${d}" fill="none" stroke="${on?'var(--accent)':'var(--nstroke)'}" stroke-width="${on?3.5:2}" stroke-linecap="round" stroke-linejoin="round"/><path data-k="edge" data-id="${e.id}" d="${d}" fill="none" stroke="transparent" stroke-width="18"/>`}
 for(const n of m.nodes){const d=dims(n),hid=M.rec&&!n.root&&!(M.shown&&M.shown.has(n.id)),lines=hid?['?']:d.lines,cls=['node',n.root?'root':'',M.sel&&M.sel.id===n.id?'sel':'',M.pending===n.id?'pend':''].join(' ');
  const sel=M.sel&&M.sel.id===n.id,shape=n.shape==='text'?`<rect class="sh" x="${-d.w/2}" y="${-d.h/2}" width="${d.w}" height="${d.h}" fill="transparent" style="${sel?'':'stroke:none'}" rx="8"/>`
   :n.shape==='ellipse'?`<ellipse class="sh" rx="${d.w/2*1.12}" ry="${d.h/2*1.12}" style="fill:var(${n.root?'--accent':'--c'+(n.c||1)})"/>`
   :`<rect class="sh" x="${-d.w/2}" y="${-d.h/2}" width="${d.w}" height="${d.h}" rx="8" style="fill:var(${n.root?'--accent':'--c'+(n.c||1)})"/>`;
  h+=`<g class="${cls}" data-k="node" data-id="${n.id}" transform="translate(${n.x} ${n.y})">${shape}<text text-anchor="middle" dominant-baseline="central">${lines.map((l,i)=>`<tspan x="0" y="${(i-(lines.length-1)/2)*20}">${esc(l)}</tspan>`).join('')}</text></g>`}
 if(M.tmpLine)h+=`<line x1="${M.tmpLine[0]}" y1="${M.tmpLine[1]}" x2="${M.tmpLine[2]}" y2="${M.tmpLine[3]}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>`;
 w.innerHTML=h}
function addRelative(id,sib){const m=M.map,n=m.nodes.find(x=>x.id===id);if(!n)return;let par=n;
 if(sib){const e=m.edges.find(x=>x.b===id);par=e?m.nodes.find(x=>x.id===e.a):null;if(!par){toast('Select a bubble that has a parent first.');return}}
